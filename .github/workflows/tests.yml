name: Tests

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.1.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libfreetype6-dev xvfb

      - name: Install (dev deps)
        run: uv sync --dev

      - name: Run tests
        run: xvfb-run --auto-servernum uv run pytest -q

      - name: Build artifacts (packaging smoke test)
        run: uv build
