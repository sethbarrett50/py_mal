[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "py-mal"
version = "0.1.8"
description = "Examples of prexisting-malware types created in modern Python; purely for education purposes only"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "PolyForm Noncommercial 1.0.0" }

dependencies = [
    "click>=8.4.1,<9",
    "mss>=10.2.0,<11",
    "pillow>=12.2.0,<13",
    "psutil>=7.2.2,<8",
    "pyautogui>=0.9.54,<1",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.1,<3",
    "pygame>=2.6.1,<3",
]

[project.scripts]
rev-shell = "rev_shell.cli:main"
rat = "rat.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.15.20,<1",
  "pytest>=9.0.3,<10",
  "pytest-mock>=3.15.1,<4",
  "pytest-cov>=7.1.0,<8",
  "pytest-timeout>=2.4.0,<3",
  "deptry>=0.25.1,<1",
  "twine>=6.2.0,<7",
]


[tool.hatch.build.targets.wheel]
packages = ["src/rat", "src/rev_shell"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
markers = [
    "smoke: Quick hardware/dependency checks",
    "unit: Isolated logic tests",
    "integration: Socket and protocol tests",
]

[project.urls]
Repository = "https://github.com/sethbarrett50/py_mal"
Issues = "https://github.com/sethbarrett50/py_mal/issues"


[tool.deptry]
root = ["src"]

[tool.deptry.per_rule_ignores]
DEP003 = ["rat", "rev_shell"]
